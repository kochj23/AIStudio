name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7

    - name: Build
      run: |
        XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)
        if [ -z "$XCODEPROJ" ]; then
          echo "No Xcode project found"
          exit 1
        fi

        SCHEME=$(xcodebuild -list -project "$XCODEPROJ" 2>/dev/null | awk '/Schemes:/{found=1; next} found && NF{print; exit}' | xargs)
        if [ -z "$SCHEME" ]; then
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
        fi

        echo "Building scheme: $SCHEME"
        xcodebuild build \
          -project "$XCODEPROJ" \
          -scheme "$SCHEME" \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
          | tail -20

    - name: Test
      run: |
        set -o pipefail
        XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)

        # Prefer a scheme that actually runs tests (the Tests scheme).
        TEST_SCHEME=$(xcodebuild -list -project "$XCODEPROJ" 2>/dev/null \
          | awk '/Schemes:/{found=1; next} found && NF{print}' \
          | sed 's/^ *//' | grep -i 'Tests' | head -1)
        if [ -z "$TEST_SCHEME" ]; then
          TEST_SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
        fi

        echo "Testing scheme: $TEST_SCHEME"
        xcodebuild test \
          -project "$XCODEPROJ" \
          -scheme "$TEST_SCHEME" \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO
