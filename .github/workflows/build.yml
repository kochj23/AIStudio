name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7

    - name: Install Metal Toolchain
      # Xcode 16 no longer bundles the Metal Toolchain by default. AIStudio's
      # MLX-native backend runs via Python (mflux/mlx-audio), so the Xcode build
      # itself needs no Metal shaders — but install the component anyway (non-fatal)
      # so the build stays green if a compiled Metal/mlx-swift dependency is added.
      run: xcodebuild -downloadComponent MetalToolchain || true

    - name: Build & Test
      run: |
        XCODEPROJ=$(find . -name "*.xcodeproj" -maxdepth 2 | head -1)
        if [ -z "$XCODEPROJ" ]; then echo "No Xcode project found"; exit 1; fi
        SCHEME="AIStudio"
        echo "Testing scheme: $SCHEME"
        set -o pipefail
        xcodebuild test \
          -project "$XCODEPROJ" \
          -scheme "$SCHEME" \
          -destination 'platform=macOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
          | tail -60
